{# SECTION: header — REQUIRED. Site identity + navbar (they're one bar).
   Reused on every page by the assembler (templates/layout.html). One <header>
   per page. See docs/THEMING.md. #}
<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/">
      <img src="{{ site.asset_base }}/ds/assets/wfl-mark.svg" alt="">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <a href="/">Home</a>
      {% for p in site.nav %}<a href="/page/{{ p.slug }}">{{ p.title }}</a>{% endfor %}
    </nav>
    <span class="site-header__spacer"></span>
    {% if site.user %}<a class="site-header__admin" href="/admin">Admin</a>{% else %}<a class="site-header__admin" href="/admin/login">Sign in</a>{% endif %}
  </div>
</header>
