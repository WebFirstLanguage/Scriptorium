<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your site · {{ site.title }}</title>
<link rel="icon" href="{{ site.asset_base }}/ds/assets/wfl-mark.svg">
<link rel="stylesheet" href="{{ site.asset_base }}/ds/styles.css">
<link rel="stylesheet" href="{{ site.asset_base }}/admin.css">
</head>
<body class="admin admin--auth">
<div class="auth-card auth-card--wide">
  <div class="auth-card__glow"></div>
  <a class="brand" href="/">
    <img src="{{ site.asset_base }}/ds/assets/wfl-mark.svg" alt="">
    <span class="brand__name">{{ site.title }}</span>
  </a>
  <h1 class="auth-card__title">Set up your site</h1>
  <p class="auth-card__sub">Choose a title, tagline, and the first admin account. You will be signed in when setup finishes.</p>
  {% if flash %}<div class="flash flash--{{ flash.kind }}">{{ flash.message }}</div>{% endif %}
  <form method="post" action="/install" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label class="field">
      <span>Site title</span>
      <input name="site_title" value="{{ form.site_title }}" autofocus autocomplete="organization">
    </label>
    <label class="field">
      <span>Tagline</span>
      <input name="site_tagline" value="{{ form.site_tagline }}" autocomplete="off">
    </label>
    <label class="field">
      <span>Admin username</span>
      <input name="username" value="{{ form.username }}" autocomplete="username">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="new-password">
    </label>
    <label class="field">
      <span>Confirm password</span>
      <input type="password" name="password_confirm" autocomplete="new-password">
    </label>
    <button class="btn btn--primary btn--block" type="submit">Create site</button>
  </form>
</div>
</body>
</html>
